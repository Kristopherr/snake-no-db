<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Link to the js file -->
    <script src="js/game.js" defer type="module"></script>
    
<!-- Project #1 31/01/23 - Kristopher Mann -->


    <!-- No css file used! -->
    <style>
        body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: rgb(0, 0, 0);
            
        }   

        #game-board{
            background-color: rgb(22, 22, 22);
            width: 100vmin;
            height: 90vmin;
            display: grid;
            /* This makes it so there is always going to be the same amount of grid squares regardless of screen size */
            grid-template-rows: repeat(21, 1fr);
            grid-template-columns: repeat(21, 1fr);
            border: solid blue 5px;
        }

        #scoreText{
            font-family: "permanent Marker", cursive;
            font-size: 200px;
            color: aliceblue;
        }

        .snake{
            background-color: green;
            border: .25vmin solid rgb(173, 171, 171);
        }


        .food{
            background-color: rgb(128, 0, 107);
            border: .25vmin solid rgb(0, 0, 0);
            border-radius: 21px;
        }
    </style>
</head>
<body>
    <div id="game-board"></div>
    <div id="scoreText">0</div>
</body>
</html>
